<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Transaction Test</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#fffaf2;color:#2d2d2d;margin:0;padding:40px 20px}
.box{max-width:720px;margin:40px auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.08);text-align:center;border-top:5px solid #d88619}
h1{color:#204f38}
.status{margin:24px 0;padding:18px;border-radius:12px;background:#f0f7f2;color:#28583f;font-weight:700}
a{display:inline-block;background:#204f38;color:#fff;text-decoration:none;padding:14px 24px;border-radius:10px;font-weight:800}
.small{font-size:13px;color:#777;word-break:break-all}
</style>
</head>
<body>
<div class="box">
<h1>Desert Secure Download Test</h1>
<p>Checking the completed Desert transaction against the multi-product Worker.</p>
<p class="small">txn_01m18rrhby7am6zgr19pfn5hc3</p>
<div id="status" class="status">Checking payment…</div>
<a id="download" href="#" hidden>Download Desert Habitat Project PDF</a>
</div>
<script>
(async function(){
  const status = document.getElementById("status");
  const link = document.getElementById("download");
  try {
    const response = await fetch("https://school-projects-india-downloads.gedeeldemailbox.workers.dev/claim", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({transaction_id:"txn_01m18rrhby7am6zgr19pfn5hc3"})
    });
    const data = await response.json();
    if (response.ok && data.status === "ready" && data.download_url) {
      status.textContent = "Payment verified. Product: " + (data.product || "unknown") + ". Secure PDF is ready.";
      link.href = data.download_url;
      link.hidden = false;
    } else {
      status.textContent = "Not ready: HTTP " + response.status + " — " + (data.status || data.error || data.message || "unknown response");
    }
  } catch(e) {
    status.textContent = "Could not contact Worker: " + e.message;
  }
})();
</script>
</body>
</html>
